<body>

  <header class="topbar">
    <h1>📦 لوحة إدارة المنتجات</h1>
    <div class="status-badge status-pending" id="connectionBadge">جارٍ الاتصال...</div>
  </header>

  <div class="container">

    <!-- حالة الاتصال -->
    <div class="card">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:14px;">🔌 حالة الاتصال:</span>
        <span id="connectionStatusText" style="font-size:14px; color:#666;">جارٍ تهيئة Firebase...</span>
      </div>
    </div>

    <!-- إضافة منتج جديد -->
    <div class="card">
      <h2>➕ إضافة منتج جديد</h2>
      <form id="addProductForm" style="display:flex; flex-direction:column; gap:12px;">
        <div class="form-group">
          <label for="productName">اسم المنتج</label>
          <input type="text" id="productName" placeholder="أدخل اسم المنتج" required>
        </div>
        <div class="form-group">
          <label for="productPrice">السعر (ر.س)</label>
          <input type="number" id="productPrice" placeholder="0.00" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="productImageUrl">رابط الصورة (Image URL)</label>
          <input type="url" id="productImageUrl" placeholder="https://example.com/product.jpg">
          <div id="imageUrlPreview" class="image-url-row hidden">
            <img id="imageUrlPreviewImg" src="" alt="معاينة">
            <span id="imageUrlPreviewText"></span>
          </div>
        </div>
        <div class="form-group">
          <label for="productCategory">الفئة (اختياري)</label>
          <input type="text" id="productCategory" placeholder="مثال: إكسسوارات، ملابس، إلخ">
        </div>
        <div class="form-group">
          <label for="productDescription">الوصف (اختياري)</label>
          <input type="text" id="productDescription" placeholder="وصف موجز للمنتج">
        </div>
        <button type="submit" class="btn btn-success" id="submitBtn">إضافة المنتج</button>
      </form>
      <div id="formMessage" class="form-message"></div>
    </div>

    <!-- ملخص سريع -->
    <div class="card">
      <h2>📊 ملخص سريع</h2>
      <div class="ui-row" style="gap:24px; flex-wrap:wrap;">
        <div><strong>إجمالي المنتجات:</strong> <span id="statsTotal">—</span></div>
        <div><strong>إجمالي الإيرادات (تقريبي):</strong> <span id="statsRevenue">—</span></div>
      </div>
    </div>

    <!-- قائمة المنتجات -->
    <div class="card">
      <h2>📋 قائمة المنتجات</h2>
      <div id="productsLoading" class="loader" style="margin-bottom:8px;"></div>
      <div id="productsError" class="hidden" style="color:#721c24; margin-bottom:10px;"></div>
      <table class="data-table hidden" id="productsTable">
        <thead>
          <tr>
            <th>#</th>
            <th>صورة المنتج</th>
            <th>اسم المنتج</th>
            <th>السعر</th>
            <th>الفئة</th>
            <th>تاريخ الإضافة</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody id="productsTableBody"></tbody>
      </table>
    </div>

  </div>

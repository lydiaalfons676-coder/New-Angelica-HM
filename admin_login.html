<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الأدمن</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 1.5rem;
        }
        .input-group {
            margin-bottom: 1rem;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* لضمان عدم خروج الإدخال عن الحدود */
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="password"]:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #error-message {
            color: red;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>لوحة تحكم الإدارة</h2>
        <div class="input-group">
            <label for="password">أدخل كلمة المرور:</label>
            <input type="password" id="password" placeholder="********">
        </div>
        <button onclick="checkPassword()">دخول</button>
        <p id="error-message">كلمة المرور غير صحيحة، حاول مرة أخرى!</p>
    </div>

    <script>
        function checkPassword() {
            const passwordInput = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            // استبدل 'admin123' بكلمة المرور التي تريدها
            const correctPassword = 'admin123';

            if (passwordInput === correctPassword) {
                alert('تم تسجيل الدخول بنجاح!');
                // هنا يمكنك توجيه المستخدم إلى صفحة الأدمن الفعلية
                window.location.href = 'admin.html'; 
            } else {
                errorMessage.style.display = 'block';
                document.getElementById('password').value = ''; // مسح الحقل بعد الخطأ
            }
        }

        // السماح بالضغط على Enter للدخول
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
